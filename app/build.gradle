plugins { id 'com.android.application' }
android {
    namespace 'com.kernahan.noahbenny'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kernahan.noahbenny'
        minSdk 22          // Fire OS 5 (oldest Fire TV sticks) and up
        targetSdk 34
        versionCode 24
        versionName '0.9.12-finale'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
}
