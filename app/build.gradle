plugins { id 'com.android.application' }
android {
    namespace 'com.kernahan.noahbenny'
    compileSdk 34
    defaultConfig {
        applicationId 'com.kernahan.noahbenny'
        minSdk 22          // Fire OS 5 (oldest Fire TV sticks) and up
        targetSdk 34
        versionCode 27
        versionName '0.9.15-autoupdate'
    }
    // One fixed signing key, so every new build installs over the old one and keeps the saved game
    signingConfigs {
        kernahan { storeFile file('kernahan.keystore'); storePassword 'kernahan'; keyAlias 'kernahan'; keyPassword 'kernahan' }
    }
    buildTypes {
        debug { signingConfig signingConfigs.kernahan }
        release { minifyEnabled false; signingConfig signingConfigs.kernahan }
    }
}
