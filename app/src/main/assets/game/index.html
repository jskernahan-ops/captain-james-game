<canvas id="c" width="960" height="540"></canvas>
<script>

'use strict';
/* Adventures of Captain James Sean Kernahan: Noah and Benny Save Kernahan Cove */
/* =========================================================
   ADVENTURES OF CAPTAIN JAMES SEAN KERNAHAN: NOAH AND BENNY SAVE KERNAHAN COVE
   Level 1 — Kernahan Cove Beach
   ========================================================= */
const W=960,H=540,T=45,ROWS=12,GRAV=0.6,MAXFALL=12;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';}
addEventListener('resize',fit);fit();

/* ---------------- INPUT ---------------- */
const IN={left:0,right:0,up:0,down:0,jump:0,roll:0,swap:0,pause:0};
const PREV={...IN};
const SRC={kb:{},nat:{ax:0,ay:0}};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  Space:'jump',KeyZ:'jump',Enter:'jump',NumpadEnter:'jump',KeyX:'roll',ShiftLeft:'roll',ShiftRight:'roll',
  KeyC:'swap',Tab:'swap',KeyP:'pause',Escape:'pause'};
addEventListener('keydown',e=>{const k=KEYMAP[e.code]||(e.keyCode===13?'jump':null);if(k){SRC.kb[k]=1;e.preventDefault();}audioUnlock();});
addEventListener('keyup',e=>{const k=KEYMAP[e.code]||(e.keyCode===13?'jump':null);if(k){SRC.kb[k]=0;e.preventDefault();}});
addEventListener('pointerdown',()=>audioUnlock());
// Called by the Android (Fire TV) wrapper
window.nativeInput=(name,down)=>{SRC.nat[name]=down?1:0;audioUnlock();};
window.nativeAxis=(x,y)=>{SRC.nat.ax=x;SRC.nat.ay=y;};
function pollInput(){
  for(const k in IN)PREV[k]=IN[k];
  const p={};
  const gps=(typeof navigator!=='undefined'&&navigator.getGamepads)?navigator.getGamepads():[];
  for(const g of gps){ if(!g)continue;
    const b=i=>g.buttons[i]&&g.buttons[i].pressed, ax=i=>g.axes[i]||0;
    // SNES / Donkey Kong Country layout: bottom (B) jump, left (Y) or top (X) roll, right (A) swap
    if(b(0))p.jump=1; if(b(2)||b(3)||b(6)||b(7))p.roll=1; if(b(1)||b(4)||b(5))p.swap=1; if(b(9)||b(8))p.pause=1;
    if(b(12)||ax(1)<-0.5)p.up=1; if(b(13)||ax(1)>0.5)p.down=1; if(b(14)||ax(0)<-0.4)p.left=1; if(b(15)||ax(0)>0.4)p.right=1;
  }
  const n=SRC.nat; if(n.ax<-0.4)p.left=1; if(n.ax>0.4)p.right=1; if(n.ay<-0.5)p.up=1; if(n.ay>0.5)p.down=1;
  for(const k in IN)IN[k]=(SRC.kb[k]||p[k]||n[k])?1:0;
}
const pressed=k=>IN[k]&&!PREV[k];

/* ---------------- AUDIO ---------------- */
let AC=null,master=null,musicBus=null,noiseBuf=null;
function audioUnlock(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
    musicBus=AC.createGain();musicBus.gain.value=0.5;musicBus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,v,slide,delay,dest){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v,delay,freq,dest){
  if(!AC)return;const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||2000;const g=AC.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+d+0.03);
}
const arp=(notes,step,type,v)=>notes.forEach((n,i)=>tone(n,step*1.6,type||'square',v||0.07,0,i*step));
const SFX={
  jump:()=>tone(300,0.16,'square',0.07,320),
  bounce:()=>tone(260,0.22,'square',0.08,520),
  coin:()=>{tone(1046,0.06,'square',0.05);tone(1568,0.16,'square',0.05,0,0.06);},
  stomp:()=>{tone(190,0.15,'triangle',0.3,-110);noise(0.08,0.15,0,1200);},
  bonk:()=>tone(160,0.12,'square',0.1,-40),
  roll:()=>tone(110,0.25,'triangle',0.28,70),
  hurt:()=>tone(520,0.4,'sawtooth',0.08,-380),
  lose:()=>arp([523,440,349,262,196],0.13,'triangle',0.18),
  boom:()=>{noise(0.35,0.45,0,900);tone(95,0.3,'sine',0.45,-45);},
  thunk:()=>tone(150,0.1,'square',0.12,-60),
  letter:()=>arp([659,784,988,1319],0.07),
  life:()=>arp([523,659,784,1046,1319],0.08),
  swap:()=>tone(600,0.1,'sine',0.14,500),
  check:()=>arp([392,523,659,784],0.09,'triangle',0.15),
  buddy:()=>arp([440,554,659,880],0.07,'triangle',0.15),
  splash:()=>noise(0.5,0.3,0,700),
  fanfare:()=>{arp([523,523,523,659,784,659,784,1046],0.12,'square',0.08);arp([262,262,262,330,392,330,392,523],0.12,'triangle',0.15);},
  blip:()=>tone(880,0.04,'square',0.03),
  swish:()=>{noise(0.3,0.25,0,5000);tone(1200,0.25,'sine',0.08,-700);},
  star:()=>arp([784,988,1175,1568,1175,1568,2093],0.06,'square',0.06),
  rope:()=>tone(380,0.09,'triangle',0.12,180),
  hop:()=>tone(200,0.12,'sine',0.1,260),
  swim:()=>{tone(420,0.14,'sine',0.07,260);noise(0.12,0.05,0,1500);},
  engineStart:()=>{for(let k=0;k<5;k++){tone(70+k*14,0.09,'sawtooth',0.07,30,k*0.09);noise(0.06,0.06,k*0.09,900);}tone(120,0.6,'sawtooth',0.05,90,0.45);},
  engineStop:()=>{tone(150,0.7,'sawtooth',0.06,-100);for(let k=0;k<3;k++)noise(0.07,0.06,0.25+k*0.16,700);},
  zoom:()=>{tone(260,0.45,'sawtooth',0.05,200);noise(0.4,0.08,0,2500);},
  cheer:()=>{arp([523,659,784,1046],0.07,'triangle',0.15);noise(0.6,0.08,0,3000);}
};
// Original sea-shanty style tune (D minor, jig feel). [midi, eighths]
const MEL=[[62,1],[65,1],[69,1],[69,1],[67,1],[65,1],[64,1],[67,1],[70,1],[69,1],[67,1],[65,1],[62,1],[65,1],[69,1],[74,1],[72,1],[69,1],[67,1],[64,1],[60,1],[62,3],
 [65,1],[69,1],[72,1],[72,1],[70,1],[69,1],[67,1],[70,1],[74,1],[74,1],[72,1],[69,1],[70,1],[69,1],[67,1],[65,1],[64,1],[62,1],[64,1],[65,1],[67,1],[69,3],
 [62,1],[65,1],[69,1],[69,1],[67,1],[65,1],[64,1],[67,1],[70,1],[69,1],[67,1],[65,1],[62,1],[65,1],[69,1],[74,1],[72,1],[69,1],[67,1],[64,1],[61,1],[62,3],
 [74,1],[72,1],[70,1],[69,1],[67,1],[65,1],[67,1],[69,1],[70,1],[69,1],[65,1],[62,1],[70,1],[69,1],[67,1],[65,1],[64,1],[62,1],[64,1],[61,1],[57,1],[62,3]];
const BASS=[50,50,43,50,50,50,48,50, 53,53,43,50,43,50,48,45, 50,50,43,50,50,50,45,50, 46,48,46,50,46,45,45,50];
const SONG=[];(()=>{let pos=0;for(const[n,l]of MEL){SONG[pos]={m:n,l};pos+=l;}for(let i=0;i<pos;i++)if(!SONG[i])SONG[i]=null;})();
const MUS={on:false,next:0,i:0,step:0.17,tr:0,song:'shanty'};
const mf=m=>440*Math.pow(2,(m-69)/12);
const seqFrom=mel=>{const s=[];let pos=0;for(const[n,l]of mel){s[pos]=n?{m:n,l}:null;pos+=l;}for(let i=0;i<pos;i++)if(!s[i])s[i]=null;return s;};
/* Coral Lagoon: a slow, dreamy underwater waltz (3/4, F major). Soft sine lead with a gentle echo,
   rippling triangle arpeggios underneath, and only a whisper of percussion. Original tune. */
const LAGOON_MEL=[[69,2],[72,2],[77,2],[76,4],[74,2],[72,2],[69,2],[67,2],[69,6],
  [70,2],[74,2],[77,2],[81,4],[79,2],[77,2],[76,2],[74,2],[76,6],
  [69,2],[72,2],[77,2],[79,3],[77,1],[76,2],[74,2],[77,2],[81,2],[79,6],
  [82,2],[81,2],[79,2],[77,2],[76,2],[74,2],[72,2],[76,2],[79,2],[77,6]];
const LAGOON_CH=[[53,1],[48,1],[53,1],[53,1],[46,1],[50,0],[46,1],[48,1],[53,1],[48,1],[50,0],[48,1],[43,0],[46,1],[48,1],[53,1]]; // [root, major?]
const LAGOON_SEQ=seqFrom(LAGOON_MEL);
/* Mount Kaboom: a driving, rumbly E-minor rock riff. Growly sawtooth bass that chugs on every
   eighth note, a punchy square lead, and a big kick/snare beat, like the mountain is about to blow. */
const VOLC_MEL=[[76,2],[74,1],[76,1],[79,2],[76,2],[74,1],[72,1],[71,2],[69,2],[71,2],[76,2],[74,1],[76,1],[79,2],[81,2],[83,4],[81,2],[79,2],
  [84,2],[83,1],[81,1],[79,2],[81,2],[83,2],[81,1],[79,1],[78,2],[74,2],[76,2],[79,2],[78,2],[75,2],[76,6],[0,2]];
const VOLC_BASS=[40,40,40,40,36,36,35,35];
const VOLC_SEQ=seqFrom(VOLC_MEL);
const SONGS={
  shanty:{len:()=>SONG.length,tick(i,d){const ev=SONG[i];
    if(ev)tone(mf(ev.m+MUS.tr),MUS.step*ev.l*0.9,'square',0.045,0,d,musicBus);
    if(i%3===0){const b=BASS[(i/3)%BASS.length];tone(mf(b-12+MUS.tr),MUS.step*2.6,'triangle',0.16,0,d,musicBus);noise(0.05,0.05,d,6000,musicBus);}
    else noise(0.03,0.02,d,8000,musicBus);}},
  lagoon:{len:()=>LAGOON_SEQ.length,tick(i,d){const ev=LAGOON_SEQ[i],st=MUS.step;
    if(ev){tone(mf(ev.m+MUS.tr),st*ev.l*1.1,'sine',0.11,0,d,musicBus);tone(mf(ev.m+12+MUS.tr),st*ev.l*0.8,'sine',0.02,0,d,musicBus);
      tone(mf(ev.m+MUS.tr),st*ev.l,'sine',0.04,0,d+st*3,musicBus);}               // soft echo, like sound under water
    const bar=Math.floor(i/6)%LAGOON_CH.length,[r,maj]=LAGOON_CH[bar],k=i%6,third=maj?4:3;
    const arp=[r-12,r+7-12,r,r+third,r+7,r+third][k];                            // rippling waltz arpeggio
    tone(mf(arp+MUS.tr),st*(k===0?5.5:2.2),'triangle',k===0?0.16:0.07,0,d,musicBus);
    if(k===0)noise(0.25,0.025,d,900,musicBus);else if(k===3)noise(0.08,0.012,d,3000,musicBus);}},
  volcano:{len:()=>VOLC_SEQ.length,tick(i,d){const ev=VOLC_SEQ[i],st=MUS.step;
    if(ev){tone(mf(ev.m+MUS.tr),st*ev.l*0.85,'square',0.05,0,d,musicBus);tone(mf(ev.m-12+MUS.tr),st*ev.l*0.7,'sawtooth',0.018,0,d,musicBus);}
    const bar=Math.floor(i/8)%VOLC_BASS.length,k=i%8,r=VOLC_BASS[bar];
    const b=[r,r,r+12,r,r+3,r,r+5,r+3][k];tone(mf(b-12+MUS.tr),st*0.8,'sawtooth',0.075,0,d,musicBus);
    if(k===0||k===4||k===5){tone(110,0.16,'sine',0.35,-70,d,musicBus);}           // kick drum
    if(k===2||k===6)noise(0.14,0.13,d,2600,musicBus);                              // snare
    else noise(0.03,0.025,d,9000,musicBus);}}                                       // hi-hat
};
function musicStart(){if(!AC)return;MUS.on=true;MUS.next=AC.currentTime+0.1;MUS.i=0;}
function musicStop(){MUS.on=false;}
function musicTick(){
  if(!AC||!MUS.on)return;const sg=SONGS[MUS.song]||SONGS.shanty;
  while(MUS.next<AC.currentTime+0.25){
    const d=Math.max(0,MUS.next-AC.currentTime);sg.tick(MUS.i%sg.len(),d);
    MUS.next+=MUS.step;MUS.i++;
  }
}

/* Skye's airplane engine: a buzzy propeller drone that's on while the boys fly.
   Speeding up (RIGHT) raises the pitch, slowing down lowers it, climbing strains it a bit higher. */
const ENG={on:false,o1:null,o2:null,lfo:null,g:null,f:null};
function engineSet(want,vx,vy){
  if(!AC)return;const t=AC.currentTime;
  if(want&&!ENG.o1){
    ENG.g=AC.createGain();ENG.g.gain.value=0;ENG.f=AC.createBiquadFilter();ENG.f.type='lowpass';ENG.f.frequency.value=1100;
    const am=AC.createGain();am.gain.value=0.5;
    ENG.o1=AC.createOscillator();ENG.o1.type='sawtooth';ENG.o2=AC.createOscillator();ENG.o2.type='square';
    ENG.lfo=AC.createOscillator();ENG.lfo.type='sine';const lg=AC.createGain();lg.gain.value=0.5;  // propeller "chop"
    ENG.lfo.connect(lg);lg.connect(am.gain);
    ENG.o1.connect(ENG.f);ENG.o2.connect(ENG.f);ENG.f.connect(am);am.connect(ENG.g);ENG.g.connect(master);
    ENG.o1.frequency.value=80;ENG.o2.frequency.value=121;ENG.lfo.frequency.value=24;
    ENG.o1.start();ENG.o2.start();ENG.lfo.start();
  }
  if(!ENG.o1)return;
  if(want){const f=62+vx*11-vy*3;
    ENG.o1.frequency.setTargetAtTime(f,t,0.12);ENG.o2.frequency.setTargetAtTime(f*1.51,t,0.12);ENG.lfo.frequency.setTargetAtTime(f*0.32,t,0.12);
    ENG.g.gain.setTargetAtTime(0.06,t,0.15);ENG.on=true;}
  else if(ENG.on){ENG.g.gain.setTargetAtTime(0,t,0.12);ENG.on=false;
    const o=[ENG.o1,ENG.o2,ENG.lfo];setTimeout(()=>{if(!ENG.on){o.forEach(x=>{try{x.stop();}catch(e){}});if(ENG.o1===o[0]){ENG.o1=ENG.o2=ENG.lfo=null;}}},900);}
}

/* ---------------- HELPERS ---------------- */
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
const circ=(x,y,r)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);};
const ell=(x,y,rx,ry,a)=>{ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),a||0,0,Math.PI*2);};
const hash=(a,b)=>{const s=Math.sin(a*12.9898+b*78.233)*43758.5453;return s-Math.floor(s);};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const FONT='"Trebuchet MS","Verdana",sans-serif';
function txt(s,x,y,size,col,align,outline){
  ctx.font='bold '+size+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(outline!==false){ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle=outline||'#2a1406';ctx.strokeText(s,x,y);}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
function wrap(s,maxW,size){
  ctx.font='bold '+size+'px '+FONT;const words=s.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}
function limb(x,y,ang,len,col,wd){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle=col;rr(-wd/2,0,wd,len,wd/2);ctx.fill();ctx.restore();}


let PUSHING=false;
/* ================= CHARACTER ART =================
   Cartoon likenesses drawn from the family photos.  */
const CH={
  noah:{name:'NOAH',w:30,h:50,speed:3.3,jump:13.3,strong:true},
  benny:{name:'BENNY',w:22,h:34,speed:3.8,jump:13.6,strong:false}
};
function smile(x0,x1,y,depth){
  // curved smile: dark mouth with a thin upper row of teeth that follows the lip curve
  const cx=(x0+x1)/2;ctx.save();ctx.beginPath();ctx.moveTo(x0,y);ctx.quadraticCurveTo(cx,y-1.2,x1,y);ctx.quadraticCurveTo(cx,y+depth*2,x0,y);ctx.closePath();
  ctx.fillStyle='#7a2b1a';ctx.fill();ctx.clip();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x0,y-2);ctx.quadraticCurveTo(cx,y-3.2,x1,y-2);ctx.lineTo(x1,y+0.6);ctx.quadraticCurveTo(cx,y+depth*0.55,x0,y+0.6);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e0707a';ell(cx,y+depth*0.95,(x1-x0)*0.28,depth*0.3);ctx.fill();ctx.restore();
}
function hairSpikes(cx,cy,r,col,t,n){
  ctx.fillStyle=col;
  for(let i=0;i<n;i++){
    const a=Math.PI*0.7+i/(n-1)*Math.PI*1.6,L=r*0.7+Math.sin(t*0.9+i*2.3)*r*0.18+(i%2?r*0.25:0);
    ctx.beginPath();ctx.moveTo(cx+Math.cos(a-0.25)*r*0.8,cy+Math.sin(a-0.25)*r*0.8);
    ctx.lineTo(cx+Math.cos(a)*(r+L),cy+Math.sin(a)*(r+L));
    ctx.lineTo(cx+Math.cos(a+0.25)*r*0.8,cy+Math.sin(a+0.25)*r*0.8);ctx.closePath();ctx.fill();
  }
  if((t>>2)%2){ctx.strokeStyle='#fff6a0';ctx.lineWidth=1.5;
    for(let k=0;k<2;k++){const a=Math.PI*(1.1+((t*7+k*5)%9)/10),x0=cx+Math.cos(a)*(r*1.5),y0=cy+Math.sin(a)*(r*1.5);
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+4,y0-3);ctx.lineTo(x0+1,y0-6);ctx.lineTo(x0+5,y0-9);ctx.stroke();}}
}
function basketball(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
  ctx.fillStyle='#f07f1e';circ(0,0,r);ctx.fill();ctx.strokeStyle='#5a2a0a';ctx.lineWidth=1.3;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();
  ctx.beginPath();ctx.arc(-r*1.15,0,r*0.75,-0.9,0.9);ctx.stroke();ctx.beginPath();ctx.arc(r*1.15,0,r*0.75,Math.PI-0.9,Math.PI+0.9);ctx.stroke();
  ctx.restore();
}
// NOAH: 6 yrs, light-brown hair short on the sides and swept up on top, ears that stick out, big toothy grin, green sweater
function noahHair(hx,hy,HR,HR2){
  // faded short sides (skin shows through), clipped to the head
  ctx.save();circ(hx,hy,12.5);ctx.clip();ctx.globalAlpha=0.42;ctx.fillStyle=HR;
  ctx.beginPath();ctx.arc(hx,hy,13,Math.PI*0.8,Math.PI*1.9);ctx.quadraticCurveTo(hx+2,hy-4,hx-8,hy+2);ctx.closePath();ctx.fill();ctx.restore();
  // longer top, brushed up and forward, with a ragged edge

const SLOTS=3;let SLOT=1,SAVE={unlocked:1};
function readSlot(i){try{const s=JSON.parse(localStorage.getItem('nb_slot'+i)||'null');if(s&&s.unlocked)return s;}catch(e){}return null;}
function writeSlot(i,s){try{if(s)localStorage.setItem('nb_slot'+i,JSON.stringify(s));else localStorage.removeItem('nb_slot'+i);}catch(e){}}

  const old=JSON.parse(localStorage.getItem('nb_save')||'null');if(old&&old.unlocked&&!readSlot(1))writeSlot(1,old);
  SLOT=Math.min(SLOTS,Math.max(1,parseInt(localStorage.getItem('nb_lastslot')||'1',10)||1));}catch(e){}

function eraseSlot(i){writeSlot(i,null);if(i===SLOT)SAVE={unlocked:1};}

function roverHasDinghy(){return SAVE.unlocked>3;}
// SECRET: at the START of any level (near where the boys begin, after the intro), press
// UP, UP, DOWN, DOWN, LEFT, RIGHT, LEFT, RIGHT. Noah does the slam dunk and SUPER STAR lasts for
// that level only: touching any enemy pops it and nothing hurts the boys, but they do NOT float
// over holes (that's only for the real rainbow barrel). Default is off; nothing on screen explains it.
const CHEAT_SEQ=['up','up','down','down','left','right','left','right'];let cheatPos=0;
function nearLevelStart(){if(L.mode==='boat')return P.bx<(L.start?L.start.x:0)+30*T;return P.x<L.start.x+14*T;}
function checkCheat(){
  if(!L||!P||L.superStar||DLG||P.state==='dead'||P.state==='win'||!nearLevelStart()){cheatPos=0;return;}
  for(const k of ['up','down','left','right'])if(pressed(k)){
    if(k===CHEAT_SEQ[cheatPos])cheatPos++;else cheatPos=(k===CHEAT_SEQ[0])?1:0;
    if(cheatPos===CHEAT_SEQ.length){cheatPos=0;L.superStar=true;L.superDunkPending=true;}}
}
function keepSuperStar(){

const ropeAng=r=>r.A*Math.sin(L.t*2*Math.PI/r.P+r.ph);

function collectStuff(){

  const ph=Math.max(P.h,58),cx=P.x+P.w/2,cy=P.y+P.h-ph/2;
  for(const c of L.coins)if(!c.got&&Math.abs(c.x-cx)<P.w/2+14&&Math.abs(c.y-cy)<ph/2+8){c.got=true;G.coins++;SFX.coin();burst(c.x,c.y,5,'#ffe066',2,0);
    if(G.coins%100===0){lives++;SFX.life();}}
  for(const l of L.letters)if(!l.got&&Math.hypot(l.x-cx,l.y-cy)<36){l.got=true;SFX.letter();burst(l.x,l.y,14,'#fff',3,0);
    if(L.letters.every(q=>q.got)){lives++;setTimeout(()=>SFX.life(),400);}}
  const k=L.kcoin;if(k&&!k.got&&Math.hypot(k.x-cx,k.y-cy)<38){k.got=true;G.kcoin=true;SFX.life();burst(k.x,k.y,30,'#ffd700',4,0.05,4);}
}
function killEnemy(e,dir){if(!e.alive)return;e.alive=false;e.vy=-7;e.vx=(dir||1)*2.5;SFX.stomp();burst(e.x+e.w/2,e.y+e.h/2,10,'#fff',3);}
function updateEnemies(){
  if(L.theme==='fort')updateFort();
  for(const e of L.enemies){
    e.t++;
    if(!e.alive){e.vy+=0.5;e.y+=e.vy;e.x+=e.vx;continue;}
    if(Math.abs(e.x-(cam.x+W/2))>W)continue;
    if(e.type==='parrot'){const nx=e.x0+Math.sin(e.t*0.015)*e.range;e.face=nx>e.x+e.w/2?1:-1;e.x=nx-e.w/2;e.y=e.y0-e.h/2+Math.sin(e.t*0.05)*18;}
    else if(isSea(e.type))moveSeaEnemy(e);
    else if(e.type==='thrower')updateThrower(e);
    else if(e.type==='ghost')moveGhost(e);
    else if(e.type==='fireball')moveFire(e);
    else if(e.type==='bat')moveBat(e);
    else if(e.type==='gull')moveGull(e);
    else if(e.type==='cball'){updateCball(e);if(!e.alive)continue;}
    else if(e.type==='roller'){updateRoller(e);if(!e.alive)continue;}
    else if(e.type==='frog'){
      if(e.onGround){e.vx=0;if(--e.cool<=0){
        const pd=P.x-e.x;if(Math.abs(pd)<320)e.dir=pd>0?1:-1;
        if(!colHasGround(Math.floor((e.x+e.w/2+e.dir*60)/T))||!colHasGround(Math.floor((e.x+e.w/2+e.dir*30)/T)))e.dir*=-1;
        e.vy=-8;e.vx=e.dir*2.3;e.cool=70+Math.floor(Math.random()*50);if(Math.abs(pd)<500)SFX.hop();}}
      e.vy=Math.min(e.vy+0.5,MAXFALL);if(moveX(e,e.vx))e.dir*=-1;e.onGround=false;moveY(e,e.vy);if(e.y>ROWS*T){e.alive=false;continue;}
    }else{
      const nx=e.x+e.dir*e.sp,fx2=e.dir>0?nx+e.w:nx,fc=Math.floor(fx2/T),midR=Math.floor((e.y+e.h/2)/T),footR=Math.floor((e.y+e.h+2)/T);
      const ft=tileAt(fc,footR);if(isSolid(tileAt(fc,midR))||!(isSolid(ft)||ft===2))e.dir*=-1;else e.x=nx;
    }
    if((P.state!=='play'&&P.state!=='rope')||!overlap(P,e,3))continue;
    if(e.type==='fireball'){if(e.up&&P.star<=0&&P.inv<=0){hurt();if(P.state==='play'){P.vy=Math.min(P.vy,-11);P.vx=P.face*3;}}continue;}
    if(P.star>0){killEnemy(e,P.face);continue;}
    const stomp=P.state==='play'&&P.vy>0&&P.prevBottom<=e.y+14&&!inWater()&&e.type!=='urchin';
    if(inWater()||e.type==='urchin'){hurt();continue;}
    if((e.type==='bonehead'||e.type==='thrower')&&!CH[P.who].strong&&P.ride!=='papa'){
      if(stomp){P.vy=-9;P.noCut=true;SFX.bonk();burst(e.x+e.w/2,e.y,6,'#fff',2);}
      else if(P.roll>0){P.roll=0;P.rollCD=10;P.vx=-P.face*5;SFX.bonk();}
      else hurt();
    }else if(stomp){killEnemy(e,P.face);P.vy=IN.jump?-12:-8.5;P.noCut=true;P.y=e.y-P.h;}
    else if(P.roll>0)killEnemy(e,P.face);
    else hurt();
  }
  for(const b of L.barrels)if(b.cool>0)b.cool--;
}
function updateCamera(){
  if(L.mode==='boat'&&P.state==='loop'){const lp=L.loop,tx=lp.x+lp.k*Math.PI-W/2,ty=Math.min(0,lp.y-2*lp.R-110);
    cam.x+=(clamp(tx,0,L.cols*T-W)-cam.x)*0.2;cam.y=(cam.y||0)+(ty-(cam.y||0))*0.2;return;}
  if(L.mode==='boat'){const tx=P.state==='win'?L.cols*T-W:P.bx-200;cam.x+=(tx-cam.x)*0.2;cam.x=clamp(cam.x,0,L.cols*T-W);
    // ride along: in the grand finale the camera climbs and dives with the dinghy
    const follow=L.climbX&&P.bx+48>L.climbX&&!(P.looped&&P.bx>L.loop.x+260),ty=follow?Math.min(0,P.by-330):0;
    cam.y=(cam.y||0)+(ty-(cam.y||0))*(follow?0.3:0.08);if(Math.abs(cam.y)<0.5)cam.y=0;return;}
  const tx=P.state==='win'?L.cols*T-W:P.x+P.w/2-W*0.4+P.face*30;cam.x+=(tx-cam.x)*0.12;
  if(L.arena&&L.arena.lock)cam.x+=(L.arena.cx-cam.x)*0.25;
  cam.x=clamp(cam.x,0,L.cols*T-W);
}

/* ================= LEVEL 3: DINGHY DASH =================
   Mine-cart style: Rover Jr (the Irish Rover's dinghy) motors along on its own.
   Press A to jump over rocks, logs and rocky gaps. */
const BOAT={speed:4.0};
function buildLevel3(){
  const [L,h]=newLevel(3,'Dinghy Dash','river',320);
  L.mode='boat';L.music={tr:2,step:0.14};L.seaCol=0;
  L.tracks=[];L.obs=[];
  let cur,X,Y;const objs=[];
  const start=(x,y,sea)=>{cur={pts:[[x,y]],kick:0,sea:!!sea};L.tracks.push(cur);X=x;Y=y;};
  const flat=n=>{const x0=X,len=n*T,st=Math.ceil(len/30);for(let i=1;i<=st;i++)cur.pts.push([x0+len*i/st,Y]);X+=len;};
  const hill=(n,dy)=>{const x0=X,y0=Y,len=n*T,st=Math.ceil(len/12);for(let i=1;i<=st;i++){const k=i/st;cur.pts.push([x0+len*k,y0+dy*(1-Math.cos(Math.PI*k))/2]);}X+=len;Y+=dy;};
  // kicker: gets steeper toward the end, then launches the dinghy into the air
  const ramp=(n,dy,kick)=>{const x0=X,y0=Y,len=n*T,st=Math.ceil(len/12);for(let i=1;i<=st;i++){const k=i/st;cur.pts.push([x0+len*k,y0+dy*k*k]);}X+=len;Y+=dy;cur.kick=kick;};
  const gap=(n,dy)=>start(X+n*T,Y+dy);
  const put=(type,dx,extra)=>objs.push(Object.assign({type,x:X+dx*T},extra||{}));
  const coinsHere=(n,dx)=>{for(let i=0;i<n;i++)objs.push({type:'coin',x:X+(dx+i*0.8)*T});};
  start(0,330);flat(16);coinsHere(4,-6);
  hill(5,70);coinsHere(5,-4.5);hill(5,-100);coinsHere(5,-4.5);hill(4,80);
  flat(3);put('rock',-1.5);
  ramp(5,-110,-9);coinsHere(4,-3.5);
  gap(2.5,40);hill(4,120);coinsHere(4,-3.5);
  flat(2);put('cbarrel',-1);
  hill(5,-70);flat(4);coinsHere(3,-3);
  gap(2,0);flat(2);put('letter',-1,{ch:'A',up:135});
  hill(4,-80);coinsHere(4,-3.5);hill(4,80);put('parrot',-2,{up:95});
  ramp(4,-70,-8);
  gap(2.5,30);hill(6,140);coinsHere(6,-5.5);
  flat(2);put('rock',-1);
  ramp(6,-170,-10.5);coinsHere(3,-2.5);
  gap(3,40);flat(8);put('cp',-7);put('cheer',-5.2);
  hill(4,-60);flat(2);put('letter',-1,{ch:'H',up:135});
  hill(5,140);flat(5);put('star',-3.5);
  hill(4,-80);coinsHere(4,-3.5);hill(4,80);flat(1);
  gap(2,0);flat(3);put('rock',-2.2);put('log',-0.6);
  ramp(5,-120,-9);
  gap(2.5,50);hill(4,100);coinsHere(4,-3.5);
  flat(2);put('cbarrel',-1);
  hill(4,-70);hill(3,50);flat(2);put('rock',-1);
  ramp(5,-110,-9);
  gap(2.5,40);flat(4);put('cp',-3.5);put('letter',-0.8,{ch:'O',up:135});
  hill(4,90);coinsHere(4,-3.5);hill(4,-60);
  flat(3);put('cbarrel',-1.5);put('kcoin',-1.5);
  hill(4,60);flat(3);put('letter',-1.5,{ch:'Y',up:125});
  gap(2,0);flat(4);put('cbarrel',-2);
  hill(4,-50);coinsHere(4,-3.5);hill(4,50);flat(3);
  ramp(5,-130,-10);
  gap(3,60);hill(5,90);coinsHere(5,-4.5);flat(2);put('rock',-1);
  hill(5,-110);coinsHere(5,-4.5);hill(4,80);put('parrot',-3,{up:100});
  ramp(4,-90,-8);
  gap(2.5,50);hill(4,40);flat(3);put('cbarrel',-1.5);
  hill(4,10);coinsHere(4,-3.5);flat(2);
  // grand finale: big climb, steep plunge, loop-de-loop, splash down by the Irish Rover
  cur.fast=true;L.climbX=X;hill(11,-560);coinsHere(11,-10.5);flat(2.5);put('whee',-0.3);
  hill(15,560);coinsHere(15,-14.5);flat(1.5);
  const lx=X,LR=165,LK=20;L.loop={x:lx,y:Y,R:LR,k:LK};
  for(let i=1;i<12;i++){const th=i/12*Math.PI*2;L.coins.push({x:lx+(LR-34)*Math.sin(th)+LK*th,y:Y-LR+(LR-34)*Math.cos(th)-0,got:false,loop:true});}
  start(lx+2*Math.PI*LK,Y);flat(4);
  const seaX=X;start(X,Y,true);flat(24);
  L.seaX=seaX;L.goal={x:seaX+9*T,chestX:-999,capX:-999};L.ship={x:seaX+13*T};
  L.cols=Math.floor(X/T);
  L.start={x:3.2*T,y:330};
  L.npcs.push({who:'tim',x:2*T,face:1});
  L.intro=[['tim','Ahoy there, Noah and Benny! Tiger Tim at yer service, the best ship taxi on the seven seas!'],
    ["tim","I fixed up the Irish Rover's dinghy, Rover Jr. She's fast as a tiger! Grrr!"],
    ['tim','The water slides run all the way down to the sea, where the Captain is waiting. Rover Jr drives herself. Press B to JUMP over rocks and gaps!'],
    ['tim',"Up the big ramps ye'll fly! Bounce on the crabs' barrels, and hold B to bounce extra high. And hold on tight for the giant LOOP-DE-LOOP at the end! Ready? Let's go!"]];
  for(const o of objs){const y=surfY(L,o.x);
    if(o.type==='rock'||o.type==='log')L.obs.push({type:o.type,x:o.x,y,broken:false});
    else if(o.type==='cbarrel')L.spawns.push({type:'cbarrel',x:o.x,y});
    else if(o.type==='parrot')L.spawns.push({type:'parrot',x:o.x,y:y-o.up,range:40});
    else if(o.type==='letter')L.letters.push({ch:o.ch,x:o.x,y:y-o.up,got:false});
    else if(o.type==='coin')L.coins.push({x:o.x,y:y-38,got:false});
    else if(o.type==='star')L.stars.push({x:o.x,y:y+14,used:false});
    else if(o.type==='cp')L.checkpoints.push({x:o.x,on:false});
    else if(o.type==='cheer')L.cheer={x0:o.x,y};
    else if(o.type==='kcoin')L.kcoin={x:o.x+92,y:y-212,got:false};
    else if(o.type==='whee')L.whee=o.x;
  }
  // coins along the flight path of every kicker jump
  for(const tr of L.tracks)if(tr.kick){const e=tr.pts[tr.pts.length-1];let x=e[0],y=e[1],vy=tr.kick;
    for(let t=1;t<34;t++){x+=4.6;vy+=GRAV;y+=vy;if(t%6===0)L.coins.push({x:x+48,y:y-30,got:false});}}
  return L;
}
function surfY(L,x){for(const tr of L.tracks){const p=tr.pts;if(x<p[0][0]||x>p[p.length-1][0])continue;return trackAt(tr,x).y;}return 400;}
function trackAt(tr,x){const p=tr.pts;let lo=0,hi=p.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(p[m][0]<=x)lo=m;else hi=m;}
  const a=p[lo],b=p[hi],k=b[0]===a[0]?0:(x-a[0])/(b[0]-a[0]);return{y:a[1]+(b[1]-a[1])*k,s:(b[1]-a[1])/Math.max(1,b[0]-a[0])};}
const onTrack=(tr,x)=>x>=tr.pts[0][0]&&x<=tr.pts[tr.pts.length-1][0];
LEVELS[3]=buildLevel3;
ENDLINES[3]=g=>[['james','Ahoy! Ye rode those water slides like real sailors, lads!'],
  ['james','Ye gathered '+g.coins+' gold coins'+(g.kcoin?' AND found the secret Kernahan Coin!':'!')],
  ['james',"Tiger Tim says Barnacle Bart's ship was spotted near his fort. We'll need all the gold we can carry. Onward!"]];

function boatBox(){P.x=P.bx+12;P.w=72;P.y=P.by-56;P.h=56;}
function boatEnemies(){
  L.enemies=L.spawns.map(s=>{
    if(s.type==='parrot'){const e={type:'parrot',alive:true,w:34,h:26,x0:s.x,y0:s.y,range:s.range||40,t:Math.floor(hash(s.x,3)*200),face:-1,vx:0,vy:0};e.x=e.x0-17;e.y=e.y0-13;return e;}
    return {type:'cbarrel',alive:true,bx:s.x,surf:s.y,x:s.x-17,y:s.y-54,w:34,h:24,t:Math.floor(hash(s.x,4)*200),dir:-1,vx:0,vy:0};
  });
  for(const o of L.obs)o.broken=false;
}
function initBoat(x){
  resetPlayer(x,330);const tr=L.tracks.find(t=>onTrack(t,x+48))||L.tracks[0],a=trackAt(tr,x+48);
  Object.assign(P,{bx:x,by:a.y,vy:0,onW:true,tr,slope:a.s,state:'ready',rt:0,lastY:a.y,coy:0,jbuf:0,spd:BOAT.speed});
  boatBox();cam.y=0;
}
function boatHurt(){
  if(P.inv>0||P.star>0||P.state!=='go')return;
  if(P.partner){
    fx.push({who:P.who,x:P.bx+60,y:P.by-10,vx:-3,vy:-9,face:-1,t:0});
    P.partner=false;P.who=P.who==='noah'?'benny':'noah';P.inv=110;SFX.hurt();
    if(P.onW){P.vy=-6;P.onW=false;P.tr=null;}burst(P.bx+48,P.by-30,10,'#fff',3);
  }else{die('bounce');P.vy=-11;}
}
function boatStartDunk(s){
  s.used=true;P.partner=true;P.who='noah';
  const x0=P.bx+62,y0=P.by-8;P.state='dunk';P.vy=0;P.dk={t:0,x0,y0,face:1,hx:x0+20};
  SFX.star();burst(s.x,s.y-24,30,'#fff',5,0.1,4);
}
function leaveTrack(vy){P.onW=false;P.vy=vy;P.tr=null;P.spd=Math.max(P.spd,4.6);}
function updateBoat(){
  P.anim++;if(P.inv>0)P.inv--;
  if(P.state==='dead'){P.deadT++;if(P.deadMode==='bounce'){P.vy+=0.5;P.by+=P.vy;}if(P.deadT>110)afterDeath();boatBox();return;}
  if(P.state==='dunk'){updateDunk();if(P.state==='play'){P.state='go';P.onW=true;}boatBox();return;}
  if(P.state==='ready'){P.rt++;if(P.rt===1)POP={text:'READY...',t:40};if(P.rt===50){P.state='go';POP={text:'GO!',t:0};SFX.boom();}boatBox();return;}
  if(P.state==='win'){boatHoist();boatBox();return;}
  if(P.state==='loop'){const lp=L.loop;P.lt+=P.loopSpd/lp.R;const th=Math.min(P.lt,Math.PI*2);
    const cx=lp.x+lp.R*Math.sin(th)+lp.k*th,cy=lp.y-lp.R+lp.R*Math.cos(th);P.bx=cx-48;P.by=cy;
    const kx=cx-Math.sin(th)*30,ky=cy-Math.cos(th)*30;
    for(const c of L.coins)if(!c.got&&Math.hypot(c.x-kx,c.y-ky)<42){c.got=true;G.coins++;SFX.coin();burst(c.x,c.y,5,'#ffe066',2,0);if(G.coins%100===0){lives++;SFX.life();}}
    if(frame%2===0)parts.push({x:kx,y:ky,vx:0,vy:0,life:16,col:'rgba(255,255,255,.7)',g:0,size:5});
    if(P.lt>=Math.PI*2){P.state='go';P.looped=true;P.onW=true;P.tr=L.tracks.find(t=>onTrack(t,cx+2))||P.tr;P.slope=0;P.spd=P.loopSpd;P.by=lp.y;SFX.cheer();POP={text:'WHOOOA!',t:0};}
    boatBox();return;}
  // speed: faster going downhill, slower climbing, like a roller coaster
  if(P.onW){const fast=P.tr&&P.tr.fast,tgt=Math.min(fast?11:6.5,BOAT.speed+(fast?5.5:2.5)*Math.max(0,P.slope))+(P.star>0?0.8:0);
    P.spd+=(tgt-P.spd)*(tgt>P.spd?0.08:0.03);if(P.spd<BOAT.speed)P.spd=BOAT.speed;}
  P.bx+=P.spd;const cx=P.bx+48;
  if(pressed('jump'))P.jbuf=8;else if(P.jbuf>0)P.jbuf--;
  if(P.onW)P.coy=9;else if(P.coy>0)P.coy--;
  if(pressed('swap')&&P.partner){P.who=P.who==='noah'?'benny':'noah';SFX.swap();}
  if(P.star>0){P.star--;if(frame%3===0)parts.push({x:P.bx+20+Math.random()*60,y:P.by-50+Math.random()*40,vx:0,vy:-0.5,life:20,col:`hsl(${frame*9%360},100%,70%)`,g:0,size:3});}
  const prev=P.by,was=P.onW;
  if(L.whee&&!P.wheed&&cx>L.whee&&P.onW){P.wheed=true;POP={text:'WHEEEE!',t:0};}
  if(L.loop&&!P.looped&&P.onW&&cx>=L.loop.x){P.state='loop';P.lt=0;P.loopSpd=Math.max(P.spd,8.5);P.vy=0;POP={text:'LOOP-DE-LOOP!',t:0};SFX.star();boatBox();return;}
  if(P.onW){
    if(onTrack(P.tr,cx)){const a=trackAt(P.tr,cx);P.by=a.y;P.slope=a.s;P.lastY=a.y;}
    else{const tr=P.tr,e=tr.pts[tr.pts.length-1],p=tr.pts[tr.pts.length-2];const s=(e[1]-p[1])/Math.max(1,e[0]-p[0]);
      const nxt=L.tracks.find(t=>t!==tr&&onTrack(t,cx)&&Math.abs(trackAt(t,cx).y-P.by)<14);
      if(nxt){P.tr=nxt;const a=trackAt(nxt,cx);P.by=a.y;P.slope=a.s;}
      else if(tr.kick){leaveTrack(tr.kick);P.noCut=true;SFX.bounce();burst(P.bx+20,P.by,12,'#e6f7ff',3,0.15);}
      else leaveTrack(Math.max(0,s*P.spd));}
  }
  if(P.jbuf>0&&P.coy>0){const base=P.onW?Math.min(0,P.slope*P.spd):0;leaveTrack(base-12);P.jbuf=0;P.coy=0;P.noCut=false;SFX.jump();}
  if(!P.onW){
    if(!IN.jump&&!P.noCut&&P.vy<-4)P.vy=-4;
    P.vy=Math.min(P.vy+GRAV,MAXFALL);P.by+=P.vy;P.floating=false;
    if(P.vy>=0){let best=null;for(const tr of L.tracks)if(onTrack(tr,cx)){const a=trackAt(tr,cx);if(prev<=a.y+12&&P.by>=a.y&&(!best||a.y<best.a.y))best={tr,a};}
      if(best){P.tr=best.tr;P.by=best.a.y;P.slope=best.a.s;P.vy=0;P.onW=true;P.lastY=best.a.y;
        if(!was){SFX.splash();burst(cx,P.by,12,'#e6f7ff',3,0.2);}}
      else if(canFloat()&&P.by>=P.lastY&&!L.tracks.some(t=>onTrack(t,cx))){P.by=P.lastY;P.vy=0;P.floating=true;P.coy=9;}}
  }
  if(P.by>H+40){die('fall');boatBox();return;}
  boatBox();
  if(P.onW&&frame%2===0)parts.push({x:P.bx-6,y:P.by-4,vx:-2-Math.random()*2,vy:-1-Math.random(),life:18,col:'rgba(255,255,255,.85)',g:0.15,size:4});
  collectStuff();
  const hull={x:P.bx+8,y:P.by-24,w:84,h:24},body={x:P.bx+14,y:P.by-56,w:70,h:56};
  for(const o of L.obs){if(o.broken||Math.abs(o.x-P.bx)>200)continue;
    const w=o.type==='log'?60:40,hh=o.type==='log'?18:36,box={x:o.x-w/2,y:o.y-hh,w,h:hh};
    if(!overlap(hull,box,2))continue;
    if(P.star>0){o.broken=true;SFX.stomp();burst(o.x,o.y-hh/2,16,o.type==='log'?'#8a5527':'#8f9aa3',4,0.2,4);}
    else if(P.vy>0&&prev<=box.y+10){P.by=box.y;P.vy=-8;P.noCut=true;P.onW=false;P.tr=null;SFX.bonk();boatBox();}
    else{boatHurt();if(P.state==='go'&&P.vy>-7){P.vy=-8;P.onW=false;P.tr=null;P.noCut=true;}}
  }
  for(const e of L.enemies){e.t++;
    if(!e.alive){e.vy+=0.5;e.y+=e.vy;e.x+=e.vx;continue;}
    if(Math.abs(e.x-P.bx)>W)continue;
    if(e.type==='parrot'){const nx=e.x0+Math.sin(e.t*0.03)*e.range;e.face=nx>e.x+17?1:-1;e.x=nx-17;e.y=e.y0-13+Math.sin(e.t*0.06)*10;}
    else{e.y=e.surf-54+Math.sin(e.t*0.08)*2;}
    const top=e.y,ebox=e.type==='cbarrel'?{x:e.bx-22,y:e.y,w:44,h:e.surf-e.y}:e;
    if(P.state!=='go'||!overlap(body,ebox,3))continue;
    if(P.star>0){killEnemy(e,1);continue;}
    if(P.vy>0&&prev<=top+14){killEnemy(e,1);P.by=top;P.vy=IN.jump?-13.5:-9;P.noCut=true;P.onW=false;P.tr=null;boatBox();}
    else boatHurt();
  }
  for(const st of L.stars)if(!st.used&&Math.abs(st.x-(P.bx+70))<30&&P.by>st.y-60){boatStartDunk(st);return;}
  for(const cp of L.checkpoints)if(!cp.on&&cx>cp.x){cp.on=true;respawn={x:cp.x-20,y:300};SFX.check();burst(cp.x,250,16,'#ffd23f',3,0.1);}
  if(P.bx>=L.goal.x&&P.onW){P.bx=L.goal.x;P.state='win';P.star=0;P.inv=0;SFX.fanfare();musicStop();boatBox();
    P.hoist={t:0,x0:P.bx,y0:P.by};}
}

  if(!L.plats)return;
  for(const p of L.plats){p.t=(p.t||0)+1;
    if(p.kind==='sink'){if(p.stood)p.y=Math.min(p.y+0.7,p.y0+120);else p.y=Math.max(p.y0,p.y-1);p.bob=Math.sin(frame*0.05+p.x)*2;}

}

function landOnPlats(){
  if(!L.plats||P.vy<0)return;
  for(const p of L.plats){const top=p.kind==='sink'?p.y+(p.bob||0):p.y;
    // small tolerance so a sinking barrel (which drops slightly faster than gravity pulls) keeps the boys standing on it
    if(P.x+P.w>p.x-p.w/2&&P.x<p.x+p.w/2&&P.prevBottom<=top+3&&P.y+P.h>=top-(p.kind==='sink'?2:0)){

  }
}

function lavaSurf(wx){return 488+Math.sin(wx*0.021+frame*0.03)*3+Math.sin(wx*0.057-frame*0.045)*1.6;}
function drawLavaCol(x,c){
  const wx0=c*T;ctx.save();ctx.beginPath();ctx.rect(x,380,T+1,H-380);ctx.clip();
  // heat glow rising off the surface
  const hg=ctx.createLinearGradient(0,400,0,492);hg.addColorStop(0,'rgba(255,110,30,0)');hg.addColorStop(1,'rgba(255,120,40,.38)');ctx.fillStyle=hg;ctx.fillRect(x,400,T+1,92);

  const g=ctx.createLinearGradient(0,484,0,H);g.addColorStop(0,'#fff3b0');g.addColorStop(0.07,'#ffc436');g.addColorStop(0.25,'#ff7b12');g.addColorStop(0.55,'#d9380d');g.addColorStop(1,'#6e1206');
  ctx.fillStyle=g;ctx.fill();ctx.save();ctx.clip();
  // slow churning bright streaks inside the flow
  ctx.strokeStyle='rgba(255,230,120,.45)';ctx.lineWidth=2;
  for(let k=0;k<3;k++){const yy=505+k*13,off=(frame*(0.3+k*0.12))%60;ctx.beginPath();for(let px=-off;px<T+60;px+=60){const ax=x+px;ctx.moveTo(ax,yy+Math.sin((wx0+px)*0.05)*3);ctx.quadraticCurveTo(ax+15,yy-4,ax+30,yy+1);}ctx.stroke();}
  // cooled basalt crust broken into plates, molten light glowing through the seams (world-aligned so columns join up)
  const sp=28,drift=frame*0.12,rows=[0,15,32,52],alph=[0.96,0.88,0.6];
  const vtx=(i,j)=>{const bx=i*sp+drift+(hash(i,j+20)-0.5)*15;return [x+bx-wx0,(j?486+rows[j]:lavaSurf(i*sp+drift)+1.5)+(j?(hash(j+40,i)-0.5)*7:0)];};
  const i0=Math.floor((wx0-drift)/sp)-1,i1=Math.floor((wx0+T-drift)/sp)+1;
  for(let j=0;j<3;j++)for(let i=i0;i<=i1;i++){
    if(hash(i,j+60)<0.14+j*0.12)continue;
    const q=[vtx(i,j),vtx(i+1,j),vtx(i+1,j+1),vtx(i,j+1)],mx=(q[0][0]+q[1][0]+q[2][0]+q[3][0])/4,my=(q[0][1]+q[1][1]+q[2][1]+q[3][1])/4;
    const sh=(k,f)=>[mx+(q[k][0]-mx)*f,my+(q[k][1]-my)*f];

/* ---------- Skye and her airplane ---------- */
function mountPlane(mc){

}
function landPlane(p){

  (L.parkedList=L.parkedList||[]).push({x0:P.x+P.w/2,y0:P.y+P.h,x:p.park,y:gt,start:L.t,face:1,lx:p.x,board:p.board,taken:false});

}

  // Skye flies straight ahead: RIGHT = faster, LEFT = slower, UP/DOWN steer
  const dir=(IN.right?1:0)-(IN.left?1:0),vdir=(IN.down?1:0)-(IN.up?1:0);P.face=1;
  const target=dir>0?4.3:dir<0?1.5:2.8;P.vx+=(target-P.vx)*0.08;

function updateFort(){

  const A=L.arena;if(!A)return;const b=L.boss;

/* ================= TREASURE MAP WORLD =================

   the river (Dinghy Dash) and Pirate Port's harbour — with smaller islands around it: a coral
   atoll (Coral Lagoon), a wreck reef, Mount Kaboom's volcano island, the cloudy sea stacks
   (Stormy Skies) and Barnacle Bart's fort out on its own rock. The Irish Rover sails a curving
   sea route around the coasts from harbour to harbour. The static scenery is painted once
   into an offscreen canvas; waves, gulls, the route, icons and the Rover animate on top. */
const MAP_WORLD_W=1700,MAP_SEA_H=462;

const MAP_SPOTS=[null,

  {x:950,y:392,sx:1030,sy:428},  // 6 Moonlight Shipwrecks (reef)

  {x:1522,y:342,sx:1614,sy:440}];// 9 Barnacle Bart's Fort
// the sea route (stops marked with their level number)
const MAP_ROUTE=[[405,432,1],[260,436],[140,428],[44,330],[45,235,2],[58,130],[200,78],[420,80,3],[620,80],[770,76],[900,58],[1022,150,4],
  [960,232],[870,262],[822,300,5],[868,368],[1030,428,6],[1100,418],[1150,368,7],[1250,334],[1292,296],[1340,292,8],[1420,330],[1462,428],[1540,454],[1614,440,9]];
let MAP_PATH=null,MAP_CACHE=null,MAP_WAVES=[];
function buildMapPath(){
  // Catmull-Rom through the waypoints, sampled densely, with cumulative distance
  const W_=MAP_ROUTE,pts=[],stops={};
  for(let i=0;i<W_.length-1;i++){const p0=W_[Math.max(0,i-1)],p1=W_[i],p2=W_[i+1],p3=W_[Math.min(W_.length-1,i+2)];
    for(let k=0;k<16;k++){const t=k/16,t2=t*t,t3=t2*t;
      const f=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);
      if(k===0&&p1[2])stops[p1[2]]=pts.length;
      pts.push({x:f(p0[0],p1[0],p2[0],p3[0]),y:f(p0[1],p1[1],p2[1],p3[1])});}}
  const last=W_[W_.length-1];stops[last[2]]=pts.length;pts.push({x:last[0],y:last[1]});
  let d=0;pts[0].d=0;for(let i=1;i<pts.length;i++){d+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);pts[i].d=d;}
  const stopD={};for(const k in stops)stopD[k]=pts[stops[k]].d;
  MAP_PATH={pts,stopD,len:d};
}
function mapPointAt(s){const P_=MAP_PATH.pts;s=clamp(s,0,MAP_PATH.len);let lo=0,hi=P_.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(P_[m].d<s)lo=m;else hi=m;}
  const a=P_[lo],b=P_[hi],k=b.d>a.d?(s-a.d)/(b.d-a.d):0;return {x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,dx:b.x-a.x};}

function mapPlaceAt(n){if(!MAP_PATH)buildMapPath();MAP.sel=n;MAP.s=mapTargetS();const p=mapPointAt(MAP.s);MAP.rx=p.x;MAP.ry=p.y;MAP.cx=clamp(p.x-W/2,0,MAP_WORLD_W-W);}
const MAP_KEYV={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
// which way the dotted path heads when leaving distance s (dir +1 = toward the next island, -1 = back)
function mapDirAt(s,dir){const a=mapPointAt(s),b=mapPointAt(s+dir*80);const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return [dx/l,dy/l];}
// the arrow key for each neighbouring island from the current dock
function mapChoices(maxSel){
  const s=MAP_PATH.stopD[MAP.sel]||0,out=[];
  for(const dir of [1,-1]){const to=MAP.sel+dir;if(to<1||to>maxSel)continue;const v=mapDirAt(s,dir);
    const ranked=Object.keys(MAP_KEYV).map(k=>({k,d:MAP_KEYV[k][0]*v[0]+MAP_KEYV[k][1]*v[1]})).sort((a,b)=>b.d-a.d);out.push({to,v,ranked});}
  if(out.length===2&&out[0].ranked[0].k===out[1].ranked[0].k){ // both paths lean the same way: the closer match keeps that arrow
    const [a,b]=out[0].ranked[0].d>=out[1].ranked[0].d?[out[0],out[1]]:[out[1],out[0]];a.key=a.ranked[0].k;b.key=b.ranked[1].k;}
  else out.forEach(o=>o.key=o.ranked[0].k);
  return out;
}
function mapTargetS(){return MAP_PATH.stopD[MAP.sel]||0;}

function updateMap(){
  if(!MAP_PATH)buildMapPath();if(MAP.s===undefined)MAP.s=mapTargetS();
  if(DLG){updateDialog();return;}
  const maxSel=Math.min(SAVE.unlocked,MAPN.length-1);
  // arrows follow the dotted path the way it looks on screen: from a dock, press the arrow that points along the path
  const docked=Math.abs(mapTargetS()-MAP.s)<4;
  for(const k of ['left','right','up','down'])if(pressed(k)){
    if(docked){const ch=mapChoices(maxSel).find(c=>c.key===k);if(ch){MAP.sel=ch.to;SFX.blip();}}
    else{ // while sailing, the arrow pointing back the way we came turns the Rover around
      const fwd=mapTargetS()>MAP.s?1:-1,v=mapDirAt(MAP.s,fwd),d=MAP_KEYV[k];
      if(d[0]*v[0]+d[1]*v[1]<-0.5){const back=MAP.sel-fwd;if(back>=1&&back<=maxSel){MAP.sel=back;SFX.blip();}}}}
  const tgt=mapTargetS(),diff=tgt-MAP.s;
  if(Math.abs(diff)>0.5){const step=Math.sign(diff)*Math.min(Math.abs(diff),Math.max(1.8,Math.min(9,Math.abs(diff)*0.06)));MAP.s+=step;}else MAP.s=tgt;
  const p=mapPointAt(MAP.s);if(Math.abs(p.x-MAP.rx)>0.3)MAP.face=p.x>MAP.rx?1:-1;MAP.rx=p.x;MAP.ry=p.y;
  MAP.cx+=(clamp(MAP.rx-W/2,0,MAP_WORLD_W-W)-MAP.cx)*0.1;
  if(pressed('jump')&&Math.abs(tgt-MAP.s)<4){if(LEVELS[MAP.sel]){musicStop();startLevel(MAP.sel);}else POP={text:'Coming soon!',t:0};}
  if(pressed('swap')){STATE_BEFORE_CAST='map';STATE='cast';}
  if(pressed('pause')){musicStop();POP=null;STATE='title';SFX.blip();} // back to the main menu (progress is already saved)
}

/* ================= MAIN LOOP ================= */
function step(){
  pollInput();frame++;musicTick();if(STATE==='play'){checkCheat();keepSuperStar();}engineSet(STATE==='play'&&L&&P&&P.ride==='plane'&&P.state==='play',P?P.vx:0,P?P.vy:0);
  if(STATE==='title'){if(pressed('jump')||pressed('pause')){audioUnlock();PROF.sel=SLOT;PROF.confirm=false;STATE='profiles';SFX.blip();}if(pressed('swap')){STATE_BEFORE_CAST='title';STATE='cast';}return;}
  if(STATE==='profiles'){updateProfiles();return;}
  if(STATE==='cast'){if(pressed('jump')||pressed('roll')||pressed('swap')||pressed('pause'))STATE=STATE_BEFORE_CAST;return;}
  if(STATE==='map'){updateMap();if(POP){POP.t++;if(POP.t>80)POP=null;}return;}
  if(STATE==='pause'){
    if(pressed('up')||pressed('left'))PAUSE.sel=0;if(pressed('down')||pressed('right'))PAUSE.sel=1;
    if(pressed('pause')||(pressed('jump')&&PAUSE.sel===0)){STATE='play';musicStart();}
    else if(pressed('jump')&&PAUSE.sel===1){musicStop();const n=L.num;DLG=null;POP=null;openMap(false);mapPlaceAt(n);SFX.blip();}
    return;}
  if(STATE==='gameover'){if(pressed('jump')){lives=5;STATE='play';respawnPlayer();musicStart();}return;}
  if(STATE==='clear'){clearT++;if(clearT>60&&pressed('jump')){if(L.num>=SAVE.unlocked){SAVE.unlocked=L.num+1;saveGame();}openMap(true);}return;}
  if(pressed('pause')&&!DLG&&(P.state==='play'||P.state==='go'||P.state==='rope')){STATE='pause';PAUSE.sel=0;musicStop();return;}
  if(DLG){updateDialog();updateCamera();updateParts();return;}
  L.t++;G.time++;
  if(P.star>0){MUS.step=0.11;MUS.tr=L.music.tr+5;}else{MUS.step=L.music.step;MUS.tr=L.music.tr;}
  if(L.mode==='boat')updateBoat();else{updatePlats();updatePlayer();if(P.state!=='dunk')updateEnemies();}updateParts();updateCamera();
}
let STATE_BEFORE_CAST='title';
function draw(){
  if(STATE==='title'){drawTitle();return;}
  if(STATE==='cast'){drawCast();return;}
  if(STATE==='profiles'){drawProfiles();return;}
  if(STATE==='map'){drawMap();if(DLG)drawDialog();return;}
  if(L.mode==='boat')renderBoat();else render();
  if(STATE==='pause')drawPause();else if(STATE==='clear')drawClear();else if(STATE==='gameover')drawGameOver();
}
let last=0,acc=0;
function loop(ts){if(!last)last=ts;acc+=Math.min(100,ts-last);last=ts;while(acc>=1000/60){step();acc-=1000/60;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
window.__G={step,draw,SRC,startLevel,openMap,mapPlaceAt,mapChoices,ropeAng,ropeW,get P(){return P},get L(){return L},get STATE(){return STATE},set STATE(v){STATE=v},get lives(){return lives},get G(){return G},get DLG(){return DLG},cam,SAVE,MAP};

/* ================= GAME PROFILES ================= */
const PROF={sel:1,confirm:false};
function updateProfiles(){
  if(PROF.confirm){
    if(pressed('jump')){eraseSlot(PROF.sel);PROF.confirm=false;SFX.splash();POP={text:'Game '+PROF.sel+' starts fresh!',t:0};}
    else if(pressed('swap')||pressed('roll')||pressed('pause')){PROF.confirm=false;SFX.blip();}
    return;}
  if(pressed('left')&&PROF.sel>1){PROF.sel--;SFX.blip();}
  if(pressed('right')&&PROF.sel<SLOTS){PROF.sel++;SFX.blip();}
  if(pressed('jump')){useSlot(PROF.sel);SFX.coin();if(SAVE.unlocked>1)openMap(false);else startLevel(1);return;}
  if(pressed('roll')&&readSlot(PROF.sel)){PROF.confirm=true;SFX.blip();}
  if(pressed('pause')||pressed('swap')){STATE='title';}
  if(POP){POP.t++;if(POP.t>90)POP=null;}
}
function drawProfiles(){
  drawBeachBG(frame*0.6);ctx.fillStyle='rgba(10,20,40,.45)';ctx.fillRect(0,0,W,H);
  txt('Choose Your Game',W/2,62,44,'#ffd23f','center');
  for(let i=1;i<=SLOTS;i++){const s=readSlot(i),x=W/2+(i-2)*290,y=270,on=PROF.sel===i,cleared=s?Math.min(9,s.unlocked-1):0;
    ctx.save();ctx.translate(x,y+(on?Math.sin(frame*0.08)*4:0));
    ctx.fillStyle=on?'#fff3d6':'rgba(255,243,214,.75)';rr(-125,-140,250,280,22);ctx.fill();ctx.strokeStyle=on?'#ffd23f':'#8a5a28';ctx.lineWidth=on?7:3;rr(-125,-140,250,280,22);ctx.stroke();
    txt('Game '+i,0,-108,32,'#6b3a14','center',false);
    // a treasure chest that fills up with gold as islands are cleared
    ctx.fillStyle='#8a5527';rr(-44,-58,88,52,8);ctx.fill();ctx.fillStyle='#e8b830';ctx.fillRect(-44,-40,88,6);
    if(cleared>=9){ctx.fillStyle='#ffd23f';ell(0,-60,40,12);ctx.fill();ctx.fillStyle='#8a5527';ctx.save();ctx.translate(0,-60);ctx.rotate(-0.8);rr(-44,-24,88,24,10);ctx.fill();ctx.restore();}
    else{ctx.fillStyle='#9e6531';rr(-46,-78,92,26,12);ctx.fill();ctx.fillStyle='#e8b830';ctx.fillRect(-6,-60,12,14);}
    // nine islands
    for(let k=0;k<9;k++){const dx=-80+k*20;ctx.fillStyle=k<cleared?'#ffd23f':'rgba(107,58,20,.25)';circ(dx,26,7);ctx.fill();}
    txt(!s?'New game':cleared>=9?'All 9 islands!':cleared+' of 9 islands',0,62,22,'#6b3a14','center',false);
    if(s&&s.unlocked>1&&cleared<9)txt('Next: '+(MAPN[Math.min(s.unlocked,9)]||{name:''}).name,0,92,15,'#8a5a28','center',false);
    ctx.restore();}
  if(PROF.confirm){const p=drawPanel(560,190);txt('Start Game '+PROF.sel+' over?',W/2,p.y+50,32,'#ffd23f','center');
    txt('All its islands will be cleared.',W/2,p.y+95,20,'#fff','center',false);txt('B  Yes, start over        A  No',W/2,p.y+145,22,'#ffd23f','center');}
  else{txt('◀ ▶ choose     B play     Y start over',W/2,H-58,22,'#fff','center');}
  if(POP)txt(POP.text,W/2,H-100,26,'#ffd23f','center');
}
