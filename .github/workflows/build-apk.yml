# Builds the game into CaptainJames.apk on GitHub's free build servers and publishes it as the
# latest Release. The installed game checks that Release every time it starts:
#   game.html     the newest game (downloaded and played automatically, saves are kept)
#   version.json  {"game": build number, "apk": app versionCode}
#   CaptainJames.apk  only offered to the TV when the app itself (versionCode) has changed
name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tell the app where its updates live
        run: |
          # a build number that always goes up (seconds since 1970), so every new game counts as newer
          G=$(date +%s)
          echo "GAME=$G" >> $GITHUB_ENV
          echo "{\"repo\":\"${{ github.repository }}\",\"game\":$G}" > app/src/main/assets/update.json
          cat app/src/main/assets/update.json
      - name: Build the APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare the release files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CaptainJames.apk
          cp app/src/main/assets/game/index.html game.html
          APK=$(grep -o 'versionCode *[0-9]*' app/build.gradle | grep -o '[0-9]*')
          echo "{\"game\":$GAME,\"apk\":$APK}" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: CaptainJames-apk
          path: CaptainJames.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-$GAME" CaptainJames.apk game.html version.json --title "Build $(date -u -d @$GAME '+%Y-%m-%d %H:%M')" --notes "Captain James game build" --latest
